<svg xmlns="http://www.w3.org/2000/svg" width="980" height="230" viewBox="0 0 980 230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#F43F5E"/></marker>
  </defs>
  <rect width="980" height="230" fill="#ffffff"/>
  <rect x="14" y="14" width="952" height="180" rx="16" fill="#FFF1F2" stroke="#FECDD3"/>
  <text x="34" y="42" fill="#1E1B4B" font-weight="bold" font-size="14">STUDY → BRIEF → LAYOUT → DESIGN → WRITE → CHECK</text>
  <g font-size="12" fill="#1E1B4B">
    <rect x="34" y="60" width="138" height="112" rx="10" fill="#fff" stroke="#1E1B4B" stroke-width="1.5"/>
    <text x="103" y="82" text-anchor="middle" font-weight="bold">1 · Study</text>
    <text x="103" y="104" text-anchor="middle">tree, manifest,</text><text x="103" y="120" text-anchor="middle">tests, docs,</text><text x="103" y="136" text-anchor="middle">brand colors</text>
    <rect x="190" y="60" width="138" height="112" rx="10" fill="#fff" stroke="#1E1B4B" stroke-width="1.5"/>
    <text x="259" y="82" text-anchor="middle" font-weight="bold">2 · Brief</text>
    <text x="259" y="104" text-anchor="middle">archetype, audience,</text><text x="259" y="120" text-anchor="middle">personality, metaphor,</text><text x="259" y="136" text-anchor="middle">palette, visibility</text>
    <rect x="346" y="60" width="138" height="112" rx="10" fill="#fff" stroke="#1E1B4B" stroke-width="1.5"/>
    <text x="415" y="82" text-anchor="middle" font-weight="bold">3 · Layout</text>
    <text x="415" y="104" text-anchor="middle">sections chosen</text><text x="415" y="120" text-anchor="middle">for this kind of</text><text x="415" y="136" text-anchor="middle">project</text>
    <rect x="502" y="60" width="138" height="112" rx="10" fill="#FFE4E6" stroke="#F43F5E" stroke-width="2"/>
    <text x="571" y="82" text-anchor="middle" font-weight="bold">4 · Design</text>
    <text x="571" y="104" text-anchor="middle">pictogram logo,</text><text x="571" y="120" text-anchor="middle">hero + diagrams</text><text x="571" y="136" text-anchor="middle">in one palette</text>
    <rect x="658" y="60" width="138" height="112" rx="10" fill="#fff" stroke="#1E1B4B" stroke-width="1.5"/>
    <text x="727" y="82" text-anchor="middle" font-weight="bold">5 · Write</text>
    <text x="727" y="104" text-anchor="middle">in the brief's voice,</text><text x="727" y="120" text-anchor="middle">one real example,</text><text x="727" y="136" text-anchor="middle">anonymized</text>
    <rect x="814" y="60" width="138" height="112" rx="10" fill="#1E1B4B"/>
    <text x="883" y="82" text-anchor="middle" font-weight="bold" fill="#fff">6 · Check</text>
    <text x="883" y="104" text-anchor="middle" fill="#FECDD3">structure + privacy:</text><text x="883" y="120" text-anchor="middle" fill="#FECDD3">MISSING / LEAK</text><text x="883" y="136" text-anchor="middle" fill="#FECDD3">until clean</text>
    <g stroke="#F43F5E" stroke-width="2" marker-end="url(#a)">
      <line x1="172" y1="116" x2="188" y2="116"/><line x1="328" y1="116" x2="344" y2="116"/><line x1="484" y1="116" x2="500" y2="116"/><line x1="640" y1="116" x2="656" y2="116"/><line x1="796" y1="116" x2="812" y2="116"/>
    </g>
  </g>
  <text x="490" y="216" text-anchor="middle" fill="#64748B" font-size="12">Two different projects never get the same logo, palette or layout.</text>
</svg>
