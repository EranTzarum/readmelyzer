<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="860" height="250" rx="10" fill="#0d1117"/>
  <rect width="860" height="34" rx="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="430" y="22" text-anchor="middle" fill="#8b949e" font-size="12">check-readme.mjs on this repo's old README, then the new one</text>
  <g fill="#c9d1d9">
    <text x="20" y="64"><tspan fill="#8b949e">$ </tspan>node scripts/check-readme.mjs old/   <tspan fill="#8b949e"># the writing-readmes README</tspan></text>
    <text x="20" y="90"><tspan fill="#f0883e" font-weight="bold">MISSING:</tspan> logo: docs/assets/logo.svg shown in the header (first 15 lines)</text>
    <text x="20" y="112"><tspan fill="#f0883e" font-weight="bold">MISSING:</tspan> TL;DR: an at-a-glance table (You do · It does · You get)</text>
    <text x="20" y="134"><tspan fill="#f0883e" font-weight="bold">MISSING:</tspan> callout: at least one &gt; [!TIP] / [!NOTE] / [!WARNING]</text>
    <text x="20" y="156"><tspan fill="#f0883e" font-weight="bold">MISSING:</tspan> paragraph: one runs 5 lines; keep paragraphs to 3-4 lines</text>
    <text x="20" y="194"><tspan fill="#8b949e">$ </tspan>node scripts/check-readme.mjs .</text>
    <text x="20" y="222"><tspan fill="#3fb950" font-weight="bold">README shape complete</tspan> (logo, 5 badges, 3 images, 10 sections)</text>
  </g>
</svg>
